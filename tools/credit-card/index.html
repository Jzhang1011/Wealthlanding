<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Rewards Router — WealthLanding</title>
  <style>body{font-family:system-ui,sans-serif;padding:2rem;color:#334155}</style>
</head>
<body>
  <p>Loading credit card router…</p>
  <script>
    (function () {
      var SRC = 'https://cdn.jsdelivr.net/gh/Jzhang1011/Wealthlanding@ad885706da4fff0d4bc4b2388cab4ead4b5bf833/tools/credit-card/index.html';
      var NEEDLE = 'if(statWallet) statWallet.innerHTML = `$${totalWallet.toFixed(0)}<span class="text-sm font-semibold text-slate-500">/mo</span>`;\n\n  renderNativePie(document.getElementById(\'sim-pie\'), perCat);\n  renderNativeBar(document.getElementById(\'sim-bar\'), totalAny, totalWallet, bestSingle);\n  renderNextBestCard(); // Refreshes the Recommender module\n}';
      var PATCH = [
        'if(statWallet) statWallet.innerHTML = `$${totalWallet.toFixed(0)}<span class="text-sm font-semibold text-slate-500">/mo</span>`;',
        '',
        '  const walletNote = document.getElementById(\'stat-wallet-note\');',
        '  if(walletNote){',
        '    walletNote.textContent = wallet.size > 0',
        '      ? `Best rates from the ${wallet.size} card${wallet.size === 1 ? \'\' : \'s\'} in your wallet`',
        '      : \'Add cards to your wallet above to see this\';',
        '  }',
        '',
        '  const singleCard = CARDS[bestSingle.cardId];',
        '  const singleTotal = Math.max(0, bestSingle.total || 0);',
        '  if(statSingle){',
        '    statSingle.innerHTML = `$${singleTotal.toFixed(0)}<span class="text-sm font-semibold text-slate-500">/mo</span>`;',
        '  }',
        '  const singleNote = document.getElementById(\'stat-single-note\');',
        '  if(singleNote){',
        '    if(singleCard){',
        '      const scope = wallet.size > 0 ? \'among cards in your wallet\' : \'among all cards in the catalog\';',
        '      singleNote.textContent = `${singleCard.name} — best one-card choice ${scope}`;',
        '    } else {',
        '      singleNote.textContent = \'—\';',
        '    }',
        '  }',
        '',
        '  renderNativePie(document.getElementById(\'sim-pie\'), perCat);',
        '  renderNativeBar(document.getElementById(\'sim-bar\'), totalAny, totalWallet, bestSingle);',
        '  renderNextBestCard(); // Refreshes the Recommender module',
        '}'
      ].join('\n');

      fetch(SRC)
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
        .then(function (html) {
          if (html.indexOf(NEEDLE) !== -1) html = html.split(NEEDLE).join(PATCH);
          document.open();
          document.write(html);
          document.close();
        })
        .catch(function (err) {
          document.body.innerHTML = '<p>Could not load the credit card router.</p><p style="color:#64748b;font-size:14px">' +
            String(err) + '</p><p><a href="' + SRC + '">Open backup copy</a></p>';
        });
    })();
  </script>
</body>
</html>
