<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Rewards Router — WealthLanding</title>
  <link rel="canonical" href="https://www.wealthlanding.com/tools/credit-card/">
  <meta name="description" content="Route everyday spending to the credit card that earns the most for each category.">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-9JMJJ5CJR4"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-9JMJJ5CJR4');</script>
  <style>body{font-family:Inter,system-ui,sans-serif;margin:0;padding:2rem;background:#f8fafc;color:#334155;text-align:center}</style>
</head>
<body>
  <p id="status">Loading Card Rewards Router…</p>
  <script>
  (function() {
    var parts = ['p00.txt', 'p01.txt', 'p02.txt', 'p03.txt', 'p04.txt', 'p05.txt', 'p06.txt'];
    Promise.all(parts.map(function(name) {
      return fetch('/tools/credit-card/parts/' + name, { credentials: 'same-origin' }).then(function(r) {
        if (!r.ok) throw new Error(name);
        return r.text();
      });
    })).then(function(chunks) {
      document.open();
      document.write(chunks.join(''));
      document.close();
    }).catch(function(err) {
      document.getElementById('status').textContent = 'Unable to load tool. Try refreshing, or open /tools/.';
      console.error(err);
    });
  })();
  </script>
  <noscript><p>This tool requires JavaScript. <a href="/tools/">Back to tools</a></p></noscript>
</body>
</html>
