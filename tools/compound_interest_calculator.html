    <script>
        function calculateCompoundInterest() {
            // Get values from inputs
            const principal = parseFloat(document.getElementById('ci-initial').value) || 0;
            const monthly = parseFloat(document.getElementById('ci-monthly').value) || 0;
            const years = parseFloat(document.getElementById('ci-years').value) || 0;
            const rateStr = document.getElementById('ci-rate').value;
            const annualRate = (parseFloat(rateStr) || 0) / 100;
            
            // Formula variables
            const n = 12; // Compounded monthly
            const t = years;
            const r = annualRate;

            // A = P(1 + r/n)^(nt)
            const futurePrincipal = principal * Math.pow(1 + (r/n), n*t);
            
            // Future Value of a Series (Monthly contributions)
            // PMT × {[(1 + r/n)^(nt) - 1] / (r/n)}
            let futureContributions = 0;
            if (r > 0) {
                 futureContributions = monthly * ( (Math.pow(1 + (r/n), n*t) - 1) / (r/n) );
            } else {
                 futureContributions = monthly * n * t;
            }

            const totalAmount = futurePrincipal + futureContributions;
            const totalInvested = principal + (monthly * 12 * years);
            const totalInterest = Math.max(0, totalAmount - totalInvested);

            // Formatters
            const formatter = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
            
            // Update DOM
            document.getElementById('ci-result-total').innerText = formatter.format(totalAmount);
            document.getElementById('ci-result-principal').innerText = formatter.format(totalInvested);
            document.getElementById('ci-result-interest').innerText = formatter.format(totalInterest);

            // Update Visual Bar
            let pPercent = (totalInvested / totalAmount) * 100;
            let iPercent = (totalInterest / totalAmount) * 100;
            
            // Handle edge case where everything is 0
            if (totalAmount === 0) { 
                pPercent = 50; 
                iPercent = 50; 
                document.getElementById('ci-bar-principal').innerText = "";
                document.getElementById('ci-bar-interest').innerText = "";
            } else {
                document.getElementById('ci-bar-principal').innerText = pPercent > 10 ? Math.round(pPercent) + "%" : "";
                document.getElementById('ci-bar-interest').innerText = iPercent > 10 ? Math.round(iPercent) + "%" : "";
            }
            
            document.getElementById('ci-bar-principal').style.width = `${pPercent}%`;
            document.getElementById('ci-bar-interest').style.width = `${iPercent}%`;
        }

        // Run calculation on page load
        window.addEventListener('DOMContentLoaded', calculateCompoundInterest);
    </script>
