<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" role="img" aria-labelledby="t d"><title id="t">How claiming age changes the monthly benefit</title><desc id="d">Original chart illustration with three bars: about 70 percent of the full benefit at age 62, 100 percent at 67, and 124 percent at 70, for people born in 1960 or later.</desc><rect width="800" height="350" fill="#f3efe6"/><line x1="120" y1="300" x2="700" y2="300" stroke="#94a3b8" stroke-width="2"/><rect x="165" y="160" width="110" height="140" rx="8" fill="#13294b"/><text x="220" y="194" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">70%</text><text x="220" y="328" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#1e293b" text-anchor="middle">Age 62</text><rect x="345" y="100" width="110" height="200" rx="8" fill="#13294b"/><text x="400" y="134" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">100%</text><text x="400" y="328" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#1e293b" text-anchor="middle">Age 67</text><rect x="525" y="52" width="110" height="248" rx="8" fill="#d9a441"/><text x="580" y="86" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#0f172a" text-anchor="middle">124%</text><text x="580" y="328" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#1e293b" text-anchor="middle">Age 70</text><text x="400" y="40" font-family="Inter,Arial,sans-serif" font-size="15" fill="#5b6475" text-anchor="middle">Monthly benefit as a share of the full-retirement-age amount (born 1960 or later)</text></svg>
