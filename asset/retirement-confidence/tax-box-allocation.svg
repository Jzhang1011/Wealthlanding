<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" role="img" aria-labelledby="t d"><title id="t">Three tax boxes</title><desc id="d">Original illustration of three boxes labeled tax-deferred (traditional 401(k) and IRA), tax-free (Roth 401(k) and Roth IRA) and taxable (brokerage account).</desc><rect width="800" height="350" fill="#f3efe6"/><rect x="0" y="300" width="800" height="50" fill="#e6dfcf"/><rect x="45" y="110" width="210" height="190" rx="12" fill="#13294b"/><path d="M45 110 l20 -32 h170 l20 32z" fill="#13294b" opacity=".75"/><text x="150" y="200" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">Tax-deferred</text><text x="150" y="230" font-family="Inter,Arial,sans-serif" font-size="14" fill="#fff" text-anchor="middle" opacity=".9">Traditional 401(k), IRA</text><rect x="295" y="110" width="210" height="190" rx="12" fill="#b45309"/><path d="M295 110 l20 -32 h170 l20 32z" fill="#b45309" opacity=".75"/><text x="400" y="200" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">Tax-free</text><text x="400" y="230" font-family="Inter,Arial,sans-serif" font-size="14" fill="#fff" text-anchor="middle" opacity=".9">Roth 401(k), Roth IRA</text><rect x="545" y="110" width="210" height="190" rx="12" fill="#d9a441"/><path d="M545 110 l20 -32 h170 l20 32z" fill="#d9a441" opacity=".75"/><text x="650" y="200" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="middle">Taxable</text><text x="650" y="230" font-family="Inter,Arial,sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" opacity=".9">Brokerage account</text></svg>
