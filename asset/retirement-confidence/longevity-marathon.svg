<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" role="img" aria-labelledby="t d"><title id="t">A long road through retirement</title><desc id="d">Original illustration of a winding path over rolling hills toward a distant sun, with mile markers at 65, 75, 85 and 95.</desc><rect width="800" height="350" fill="#f3efe6"/><circle cx="660" cy="90" r="46" fill="#f2c46d"/><path d="M0 250 Q200 170 400 230 T800 200 V350 H0z" fill="#d7e3d0"/><path d="M0 290 Q220 230 420 280 T800 260 V350 H0z" fill="#b9cfb1"/><path d="M120 350 C220 300 300 300 380 270 S560 220 640 190" stroke="#faf8f3" stroke-width="34" fill="none" stroke-linecap="round"/><path d="M120 350 C220 300 300 300 380 270 S560 220 640 190" stroke="#d9a441" stroke-width="3" stroke-dasharray="10 12" fill="none"/><g><rect x="207" y="278" width="6" height="40" fill="#13294b"/><rect x="186" y="256" width="48" height="26" rx="5" fill="#13294b"/><text x="210" y="274" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">65</text></g><g><rect x="347" y="242" width="6" height="40" fill="#13294b"/><rect x="326" y="220" width="48" height="26" rx="5" fill="#13294b"/><text x="350" y="238" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">75</text></g><g><rect x="497" y="196" width="6" height="40" fill="#13294b"/><rect x="476" y="174" width="48" height="26" rx="5" fill="#13294b"/><text x="500" y="192" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">85</text></g><g><rect x="617" y="160" width="6" height="40" fill="#13294b"/><rect x="596" y="138" width="48" height="26" rx="5" fill="#13294b"/><text x="620" y="156" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">95</text></g></svg>
