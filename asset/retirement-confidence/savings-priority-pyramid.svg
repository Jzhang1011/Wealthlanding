<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" role="img" aria-labelledby="t d"><title id="t">The savings priority pyramid</title><desc id="d">Original illustration of a seven-level pyramid: emergency reserve at the base, then employer match, high-cost debt, HSA if eligible, more workplace savings, IRA, and taxable investing at the top.</desc><rect width="800" height="350" fill="#f3efe6"/><rect x="120.0" y="300" width="560" height="36" rx="5" fill="#13294b"/><text x="400" y="324" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1. Emergency reserve</text><rect x="155.0" y="260" width="490" height="36" rx="5" fill="#1b3a68"/><text x="400" y="284" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2. Employer match</text><rect x="190.0" y="220" width="420" height="36" rx="5" fill="#22406f"/><text x="400" y="244" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">3. High-cost debt</text><rect x="225.0" y="180" width="350" height="36" rx="5" fill="#2f5288"/><text x="400" y="204" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">4. HSA (if eligible)</text><rect x="260.0" y="140" width="280" height="36" rx="5" fill="#b45309"/><text x="400" y="164" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">5. More workplace savings</text><rect x="295.0" y="100" width="210" height="36" rx="5" fill="#c26a1a"/><text x="400" y="124" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">6. IRA</text><rect x="330.0" y="60" width="140" height="36" rx="5" fill="#d9a441"/><text x="400" y="84" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">7. Taxable investing</text></svg>
